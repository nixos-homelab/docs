name: Check

# Builds the site from the module repos the flake pins, without deploying it
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - name: Build the documentation
      run: |
        nix build .#config -o mkdocs.yml
        nix run .#mkdocs -- build --strict --config-file mkdocs.yml --site-dir site
